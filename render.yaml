services:
  # Backend API
  - type: web
    name: prpl-crm-api
    runtime: node
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # Frontend
  - type: web
    name: prpl-crm
    runtime: static
    region: frankfurt
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      # Content-hashed build assety (Vite dáva do názvu hash, napr.
      # index-Cu59bbMV.js) sú immutable — obsah sa pri zmene NIKDY neprepíše,
      # zmení sa názov. Preto ich cachujeme 1 rok (rýchlejšie opakované návštevy
      # + lepšie Core Web Vitals). MUSÍ ísť PRED /*, Render vyhodnocuje zhora
      # nadol (first-match), inak by /* no-cache zabralo aj assety.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Apple Universal Links association file has NO extension — we must force
      # application/json Content-Type so iOS accepts it during app-install
      # association fetch. Also must not be cached longer than 1 day.
      # Cache-Control pravidlá .well-known MUSIA byť PRED /* (rovnako ako
      # /assets/*) — predtým boli za ním a pri first-match nikdy neplatili.
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /.well-known/apple-app-site-association
        name: Cache-Control
        value: public, max-age=86400
      # Android Digital Asset Links — already served with the right extension,
      # but an explicit Cache-Control keeps the verification fast on install.
      - path: /.well-known/assetlinks.json
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: Cache-Control
        value: no-cache
      # Bezpečnostné hlavičky dokumentu SPA. helmet na API serveri chráni len
      # odpovede API — index.html servíruje tento statický host. Názvy hlavičiek
      # sú jedinečné, takže poradie voči Cache-Control pravidlám nehrá rolu.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      # CSP zatiaľ REPORT-ONLY: porušenia chodia do Diagnostiky
      # (POST /api/errors/csp, názov CSPViolation). Keď tam ~2 týždne nič
      # legitímne nepribudne, premenovať na Content-Security-Policy.
      # Zdroje: inline skript v index.html (iOS SW neutralizácia) →
      # 'unsafe-inline'; Google Fonts; gtag po súhlase (googletagmanager +
      # google-analytics); API + Socket.IO; náhľady súborov cez blob:.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://perun-crm-api.onrender.com; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' https://perun-crm-api.onrender.com wss://perun-crm-api.onrender.com https://prplcrm.eu wss://prplcrm.eu https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; report-uri https://perun-crm-api.onrender.com/api/errors/csp"
    routes:
      # Pre-rendered statické stránky pre Google OAuth verification
      # (reviewer + Googlebot vidia plný text policy/VOP bez JS).
      # MUSIA ísť PRED catch-all, lebo Render spracováva routes zhora dolu.
      # POZOR: cieľ musí byť /ochrana-udajov/index.html — pre-rendrované súbory
      # sú v adresároch public/ochrana-udajov/index.html, NIE ako .html v roote.
      # Predtým cieľ /ochrana-udajov.html neexistoval → rewrite prepadol na
      # catch-all /* → /index.html a Google/crawleri dostávali prázdny SPA shell
      # namiesto legal obsahu (overené live curl 2026-07).
      - type: rewrite
        source: /ochrana-udajov
        destination: /ochrana-udajov/index.html
      - type: rewrite
        source: /vop
        destination: /vop/index.html
      # SPA fallback pre všetky ostatné routes (React Router zaberie).
      # NOTE: /.well-known/* physical files are served BEFORE this rewrite by
      # Render's static-first resolution, so assetlinks + apple-app-site-association
      # are not swallowed by the SPA fallback.
      - type: rewrite
        source: /*
        destination: /index.html
